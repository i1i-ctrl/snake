<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Play a beginner-built Snake browser game. Use the arrow keys to eat apples, grow the snake, and beat your score.">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Gili">
  <meta property="og:title" content="Snake Game by Gili">
  <meta property="og:description" content="A free online Snake game built with HTML, CSS, and JavaScript.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://i1i-ctrl.github.io/snake/">
  <link rel="canonical" href="https://i1i-ctrl.github.io/snake/">
  <title>Snake Game by Gili | Free Online Browser Game</title>
  <link rel="stylesheet" href="style.css">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoGame",
      "name": "Snake Game by Gili",
      "description": "A free online Snake browser game where the player uses arrow keys to eat apples, grow the snake, and avoid crashing.",
      "url": "https://i1i-ctrl.github.io/snake/",
      "applicationCategory": "Game",
      "operatingSystem": "Any",
      "author": {
        "@type": "Person",
        "name": "Gili"
      }
    }
  </script>
</head>
<body>
  <main class="game-shell">
    <section class="top-bar" aria-label="Game information">
      <div>
        <p class="eyebrow">Games Portal</p>
        <h1>Snake</h1>
      </div>

      <div class="score-panel" aria-live="polite">
        <span>Score</span>
        <strong id="score">0</strong>
      </div>
    </section>

    <section class="board-wrap" aria-label="Snake game board">
      <canvas id="game-board" width="480" height="480"></canvas>
      <div id="message" class="message">
        <strong>Press Start</strong>
        <span>Use the arrow keys to move.</span>
      </div>
    </section>

    <section class="controls" aria-label="Game controls">
      <button id="start-button" type="button">Start</button>
      <button id="pause-button" type="button">Pause</button>
      <button id="restart-button" type="button">Restart</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
