<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Block Blast - Light Theme</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --board-bg: #e1e8f0;
            --cell-empty: #cdd7e5;
            --text-main: #2d3748;
            --text-muted: #718096;
            --primary: #4299e1;
            --shadow: rgba(0, 0, 0, 0.1);
        }
        
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden;
            touch-action: none; /* Prevent scrolling while dragging */
        }

        /* Header & Score */
        header {
            width: 100%; max-width: 400px;
            display: flex; justify-content: space-between; align-items: flex-end;
            padding: 20px 20px 10px;
        }
        .score-box { text-align: left; }
        .score-box h1 { margin: 0; font-size: 36px; color: var(--primary); font-weight: 800; }
        .score-box span { font-size: 14px; color: var(--text-muted); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .high-score { text-align: right; }
        .high-score h2 { margin: 0; font-size: 24px; color: var(--text-main); }

        /* Game Board */
        #game-container {
            position: relative;
            background: var(--board-bg);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 10px 25px var(--shadow), inset 0 4px 6px rgba(255,255,255,0.5);
            margin-bottom: 20px;
        }
        
        #board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 2px;
            width: 320px; height: 320px;
        }

        .cell {
            background-color: var(--cell-empty);
            border-radius: 4px;
            width: 100%; height: 100%;
            transition: all 0.15s ease;
        }

        /* The Tray */
        #tray {
            width: 100%; max-width: 400px;
            display: flex; justify-content: space-evenly; align-items: center;
            height: 120px;
        }

        .shape-container {
            width: 100px; height: 100px;
            display: flex; justify-content: center; align-items: center;
        }

        .shape {
            display: grid;
            gap: 2px;
            cursor: grab;
        }
        .shape:active { cursor: grabbing; }

        /* The Blocks themselves */
        .block {
            width: 24px; height: 24px; /* Tray size */
            border-radius: 4px;
            box-shadow: inset 0 3px 0 rgba(255,255,255,0.3), inset 0 -3px 0 rgba(0,0,0,0.15), 0 2px 4px rgba(0,0,0,0.2);
        }
        .board-block {
            width: 100%; height: 100%;
            border-radius: 4px;
            box-shadow: inset 0 4px 0 rgba(255,255,255,0.3), inset 0 -4px 0 rgba(0,0,0,0.15);
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes clearAnim {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; filter: brightness(1.5); }
            100% { transform: scale(0); opacity: 0; }
        }
        .clearing { animation: clearAnim 0.3s forwards; }

        /* Dragging Clone */
        #drag-clone {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            transform: scale(1.5); /* Make it bigger when dragging */
            transition: transform 0.1s;
        }

        /* Leaderboard Modal */
        #modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(5px);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 2000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            text-align: center;
            width: 90%; max-width: 350px;
        }
        .modal-content h2 { margin-top: 0; color: var(--primary); font-size: 32px; }
        .leaderboard-list {
            list-style: none; padding: 0; margin: 20px 0;
            text-align: left;
        }
        .leaderboard-list li {
            display: flex; justify-content: space-between;
            padding: 10px 0; border-bottom: 2px dashed var(--cell-empty);
            font-size: 18px; font-weight: bold;
        }
        button {
            background: var(--primary); color: white;
            border: none; padding: 12px 24px; border-radius: 8px;
            font-size: 18px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 0 #2b6cb0;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        button:active { transform: translateY(4px); box-shadow: 0 0 0 #2b6cb0; }
        
        /* Combo Text */
        #combo-text {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            font-size: 48px; font-weight: 900; color: #ff9f1c;
            text-shadow: 0 4px 0 #d68012, 0 10px 20px rgba(0,0,0,0.2);
            opacity: 0; pointer-events: none; z-index: 500;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -30%) scale(0.8); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -70%) scale(1); }
        }

    </style>
</head>
<body>

    <header>
        <div class="score-box">
            <span>Score</span>
            <h1 id="score">0</h1>
        </div>
        <div class="high-score">
            <span>Best</span>
            <h2 id="high-score">0</h2>
        </div>
    </header>

    <div id="game-container">
        <div id="board"></div>
        <div id="combo-text">COMBO!</div>
    </div>

    <div id="tray">
        <div class="shape-container" id="slot-0"></div>
        <div class="shape-container" id="slot-1"></div>
        <div class="shape-container" id="slot-2"></div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <h2>GAME OVER</h2>
            <p>No more moves!</p>
            <h3 style="font-size: 24px; margin: 10px 0;">Score: <span id="final-score" style="color: var(--primary)"></span></h3>
            
            <ul class="leaderboard-list" id="leaderboard">
                </ul>
            
            <button onclick="resetGame()">PLAY AGAIN</button>
        </div>
    </div>

<script>
// --- Configuration & State ---
const BOARD_SIZE = 8;
const CELL_SIZE = 40; // 320px / 8
const boardElement = document.getElementById('board');
const scoreElement = document.getElementById('score');
const highScoreElement = document.getElementById('high-score');
const comboText = document.getElementById('combo-text');
const modal = document.getElementById('modal');

let grid = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));
let score = 0;
let highScore = localStorage.getItem('blockBlastHighScore') || 0;
let leaderboards = JSON.parse(localStorage.getItem('blockBlastLeaderboard')) || [];

highScoreElement.innerText = highScore;

// --- Shapes Dictionary ---
const COLORS = ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93', '#f15bb5', '#00f5d4'];
const SHAPES = [
    { m: [[1]], name: 'dot' },
    { m: [[1,1],[1,1]], name: 'square' },
    { m: [[1,1,1]], name: 'line3h' },
    { m: [[1],[1],[1]], name: 'line3v' },
    { m: [[1,1,1,1]], name: 'line4h' },
    { m: [[1],[1],[1],[1]], name: 'line4v' },
    { m: [[1,1,0],[0,1,1]], name: 'z' },
    { m: [[0,1,1],[1,1,0]], name: 's' },
    { m: [[1,1,1],[1,0,0],[1,0,0]], name: 'L' },
    { m: [[1,1,1],[0,0,1],[0,0,1]], name: 'J' },
    { m: [[1,1],[1,0]], name: 'mini-L' },
    { m: [[1,1,1],[0,1,0]], name: 'T' },
    { m: [[1,0,1],[1,1,1]], name: 'U' }
];

// --- Initialization ---
function initBoard() {
    boardElement.innerHTML = '';
    for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.id = `cell-${r}-${c}`;
            boardElement.appendChild(cell);
        }
    }
}

function spawnShapes() {
    let emptySlots = 0;
    for (let i = 0; i < 3; i++) {
        const slot = document.getElementById(`slot-${i}`);
        if (slot.children.length === 0) {
            emptySlots++;
        }
    }
    
    // Only spawn new shapes if all 3 slots are empty
    if (emptySlots === 3) {
        for (let i = 0; i < 3; i++) {
            const slot = document.getElementById(`slot-${i}`);
            const randomShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
            const randomColor = COLORS[Math.floor(Math.random() * COLORS.length)];
            createShapeDOM(slot, randomShape.m, randomColor, i);
        }
    }
    
    // Wait a frame for DOM rendering, then check game over
    setTimeout(checkGameOver, 50);
}

function createShapeDOM(container, matrix, color, slotIndex) {
    const shapeDiv = document.createElement('div');
    shapeDiv.classList.add('shape');
    shapeDiv.style.gridTemplateColumns = `repeat(${matrix[0].length}, 24px)`;
    shapeDiv.dataset.matrix = JSON.stringify(matrix);
    shapeDiv.dataset.color = color;
    shapeDiv.dataset.slot = slotIndex;

    for (let r = 0; r < matrix.length; r++) {
        for (let c = 0; c < matrix[r].length; c++) {
            const block = document.createElement('div');
            if (matrix[r][c]) {
                block.classList.add('block');
                block.style.backgroundColor = color;
            } else {
                block.style.background = 'transparent';
            }
            shapeDiv.appendChild(block);
        }
    }

    // Touch and Mouse events for dragging
    shapeDiv.addEventListener('pointerdown', handleDragStart);
    container.appendChild(shapeDiv);
}

// --- Drag and Drop Logic ---
let draggedShape = null;
let dragClone = null;
let dragOffset = { x: 0, y: 0 };

function handleDragStart(e) {
    if (e.target.classList.contains('shape')) draggedShape = e.target;
    else draggedShape = e.target.closest('.shape');
    
    if (!draggedShape) return;

    // Create a clone to follow the cursor/finger
    dragClone = draggedShape.cloneNode(true);
    dragClone.id = 'drag-clone';
    document.body.appendChild(dragClone);

    // Make the original invisible
    draggedShape.style.opacity = '0';

    // Calculate offset so the shape snaps to the finger nicely
    const rect = draggedShape.getBoundingClientRect();
    // Shift grab point slightly above finger so player can see the blocks
    dragOffset.x = e.clientX - rect.left;
    dragOffset.y = e.clientY - rect.top + 40; 

    moveClone(e.clientX, e.clientY);

    document.addEventListener('pointermove', handleDragMove);
    document.addEventListener('pointerup', handleDragEnd);
}

function handleDragMove(e) {
    if (!dragClone) return;
    e.preventDefault(); // Prevent scrolling on mobile
    moveClone(e.clientX, e.clientY);
}

function moveClone(x, y) {
    // The scale is 1.5 in CSS, adjust positioning
    dragClone.style.left = `${x - dragOffset.x}px`;
    dragClone.style.top = `${y - dragOffset.y}px`;
}

function handleDragEnd(e) {
    document.removeEventListener('pointermove', handleDragMove);
    document.removeEventListener('pointerup', handleDragEnd);

    if (!dragClone) return;

    // Determine grid drop location based on center of the dragged shape
    const cloneRect = dragClone.getBoundingClientRect();
    const boardRect = boardElement.getBoundingClientRect();
    
    // Scale factor between Tray blocks (24px * 1.5 drag scale = 36px) and Board blocks (CELL_SIZE = ~40px)
    // We calculate the top-left cell where the matrix should start
    const relX = cloneRect.left - boardRect.left;
    const relY = cloneRect.top - boardRect.top;
    
    const col = Math.round(relX / CELL_SIZE);
    const row = Math.round(relY / CELL_SIZE);

    const matrix = JSON.parse(draggedShape.dataset.matrix);
    const color = draggedShape.dataset.color;

    if (canPlace(matrix, row, col)) {
        placeShape(matrix, row, col, color);
        draggedShape.remove(); // Remove from tray completely
        addScore(matrix.flat().filter(v => v === 1).length * 10); // 10 points per block
        checkLines();
        spawnShapes();
    } else {
        // Snap back to tray
        draggedShape.style.opacity = '1';
    }

    dragClone.remove();
    dragClone = null;
    draggedShape = null;
}

// --- Game Logic ---
function canPlace(matrix, r, c) {
    for (let i = 0; i < matrix.length; i++) {
        for (let j = 0; j < matrix[i].length; j++) {
            if (matrix[i][j]) {
                const targetR = r + i;
                const targetC = c + j;
                if (targetR < 0 || targetR >= BOARD_SIZE || targetC < 0 || targetC >= BOARD_SIZE) return false; // Out of bounds
                if (grid[targetR][targetC] !== null) return false; // Cell taken
            }
        }
    }
    return true;
}

function placeShape(matrix, r, c, color) {
    for (let i = 0; i < matrix.length; i++) {
        for (let j = 0; j < matrix[i].length; j++) {
            if (matrix[i][j]) {
                grid[r + i][c + j] = color;
                renderCell(r + i, c + j, color);
            }
        }
    }
}

function renderCell(r, c, color) {
    const cell = document.getElementById(`cell-${r}-${c}`);
    if (color) {
        cell.innerHTML = `<div class="board-block" style="background-color: ${color}"></div>`;
    } else {
        cell.innerHTML = '';
        cell.style.backgroundColor = 'var(--cell-empty)';
    }
}

function checkLines() {
    let rowsToClear = [];
    let colsToClear = [];

    // Check Rows
    for (let r = 0; r < BOARD_SIZE; r++) {
        if (grid[r].every(cell => cell !== null)) rowsToClear.push(r);
    }
    // Check Cols
    for (let c = 0; c < BOARD_SIZE; c++) {
        let full = true;
        for (let r = 0; r < BOARD_SIZE; r++) {
            if (grid[r][c] === null) full = false;
        }
        if (full) colsToClear.push(c);
    }

    const totalLines = rowsToClear.length + colsToClear.length;
    if (totalLines > 0) {
        // Combo Points
        let points = totalLines * 100;
        if (totalLines > 1) {
            points *= totalLines; // Huge combo multiplier
            showComboText(totalLines);
        }
        addScore(points);

        // Animate and clear
        rowsToClear.forEach(r => {
            for (let c = 0; c < BOARD_SIZE; c++) {
                animateClear(r, c);
                grid[r][c] = null;
            }
        });
        colsToClear.forEach(c => {
            for (let r = 0; r < BOARD_SIZE; r++) {
                animateClear(r, c);
                grid[r][c] = null;
            }
        });

        // Actually clear the DOM after animation
        setTimeout(() => {
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    renderCell(r, c, grid[r][c]);
                }
            }
            checkGameOver(); // Re-check game over after clearing space
        }, 300);
    }
}

function animateClear(r, c) {
    const cell = document.getElementById(`cell-${r}-${c}`);
    if (cell.firstChild) {
        cell.firstChild.classList.add('clearing');
    }
}

function showComboText(lines) {
    let texts = { 2: "DOUBLE!", 3: "TRIPLE!", 4: "QUAD!", 5: "INSANE!", 6: "GODLIKE!" };
    comboText.innerText = texts[lines] || "COMBO!";
    comboText.style.animation = 'none';
    void comboText.offsetWidth; // trigger reflow
    comboText.style.animation = 'floatUp 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
}

function addScore(pts) {
    score += pts;
    scoreElement.innerText = score;
    if (score > highScore) {
        highScore = score;
        highScoreElement.innerText = highScore;
        localStorage.setItem('blockBlastHighScore', highScore);
    }
}

function checkGameOver() {
    // Get available shapes from DOM
    const availableShapes = document.querySelectorAll('.shape');
    if (availableShapes.length === 0) return; // Wait for spawn
    
    let canMove = false;

    availableShapes.forEach(shapeDiv => {
        const matrix = JSON.parse(shapeDiv.dataset.matrix);
        // Test every cell on the board
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (canPlace(matrix, r, c)) {
                    canMove = true;
                }
            }
        }
    });

    if (!canMove) {
        handleGameOver();
    }
}

function handleGameOver() {
    // Save to leaderboard
    leaderboards.push(score);
    leaderboards.sort((a, b) => b - a); // Sort descending
    leaderboards = leaderboards.slice(0, 5); // Keep top 5
    localStorage.setItem('blockBlastLeaderboard', JSON.stringify(leaderboards));

    // Render leaderboard modal
    document.getElementById('final-score').innerText = score;
    const list = document.getElementById('leaderboard');
    list.innerHTML = '';
    
    leaderboards.forEach((s, idx) => {
        const li = document.createElement('li');
        li.innerHTML = `<span>#${idx + 1}</span> <span>${s} pts</span>`;
        if (s === score) li.style.color = 'var(--primary)'; // Highlight current score
        list.appendChild(li);
    });

    modal.style.display = 'flex';
}

function resetGame() {
    modal.style.display = 'none';
    grid = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));
    score = 0;
    scoreElement.innerText = score;
    
    // Clear Tray
    for (let i = 0; i < 3; i++) document.getElementById(`slot-${i}`).innerHTML = '';
    
    initBoard();
    spawnShapes();
}

// --- Start Game ---
initBoard();
spawnShapes();

</script>
</body>
</html>
